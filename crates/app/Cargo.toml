[package]
name = "key-helper"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Automatically fixes text typed in the wrong keyboard layout on Windows."

[dependencies]
key-helper-core = { path = "../core" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
] }
